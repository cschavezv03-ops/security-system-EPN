<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="600" height="1000" role="img" aria-label="Plano del campus (placeholder)">
  <!--
    PLACEHOLDER del plano del campus EPN. Sustituir por la ilustración oficial
    (web/public/mapa-epn.png o .svg) manteniendo un aspecto vertical parecido
    (~0.6 de ancho/alto) para que las coordenadas pos_x/pos_y sigan cuadrando.
    Ver docs/08_MAPA_INTERACTIVO.md.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2340"/>
      <stop offset="1" stop-color="#0a1c33"/>
    </linearGradient>
  </defs>
  <rect width="600" height="1000" fill="url(#fondo)"/>

  <!-- Vías principales -->
  <g stroke="#20406b" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M60 120 C 200 260, 380 200, 540 360"/>
    <path d="M90 520 C 260 560, 380 640, 300 760"/>
    <path d="M120 900 L 520 700"/>
  </g>

  <!-- Manzanas / edificios estilizados -->
  <g fill="#16345a" stroke="#2b5488" stroke-width="2">
    <rect x="96"  y="240" width="80" height="60" rx="6"/>
    <rect x="180" y="560" width="90" height="70" rx="6"/>
    <rect x="150" y="660" width="80" height="60" rx="6"/>
    <rect x="286" y="270" width="90" height="70" rx="6"/>
    <rect x="368" y="140" width="80" height="60" rx="6"/>
    <rect x="404" y="210" width="80" height="60" rx="6"/>
    <rect x="462" y="290" width="90" height="70" rx="6"/>
    <rect x="316" y="470" width="90" height="70" rx="6"/>
    <rect x="252" y="360" width="70" height="60" rx="6"/>
    <rect x="70"  y="200" width="70" height="55" rx="6"/>
  </g>

  <!-- Áreas verdes -->
  <g fill="#12492f" opacity="0.7">
    <ellipse cx="300" cy="620" rx="70" ry="46"/>
    <ellipse cx="470" cy="620" rx="50" ry="34"/>
  </g>

  <!-- Encabezado -->
  <g font-family="system-ui, sans-serif" fill="#e8eef7">
    <text x="40" y="70" font-size="34" font-weight="700">Campus Politécnico</text>
    <text x="40" y="104" font-size="20" fill="#9fb4d0">José Rubén Orellana R.</text>
    <text x="40" y="978" font-size="14" fill="#6f88ab">Plano de referencia (placeholder) — reemplazar por el mapa oficial de la EPN</text>
  </g>
</svg>
